<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMODACHI & Milkky Berry - Importaciones & Casillero Coreano 🌸</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Fredoka & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- ==================== FIREBASE SDKs ==================== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <style>
    :root {
      --bg-color: #FAF6EE;
      --card-bg: #FFFFFF;
      --primary-pink: #F8C3D2;
      --accent-pink: #E88BA7;
      --soft-pink-bg: #FFF0F5;
      --pastel-green: #97B69C;
      --dark-green: #37533E;
      --pastel-purple: #D7C7F4;
      --pastel-blue: #B2DAFA;
      --pastel-yellow: #FFF2B2;
      --text-dark: #333333;
      --border-color: #E2D9C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Layout Adaptable */
    .app-container {
      width: 100%;
      max-width: 960px;
      background-color: var(--bg-color);
      min-height: 100vh;
      position: relative;
      padding-top: 100px;
      padding-bottom: 95px;
      box-shadow: 0 0 25px rgba(0,0,0,0.06);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    @media (max-width: 640px) {
      .app-container {
        max-width: 480px;
      }
    }

    /* Barra Superior para Selector de Rol / Auth Bar */
    .role-switcher-bar {
      position: fixed;
      top: 0;
      width: 100%;
      max-width: 960px;
      background-color: var(--dark-green);
      color: white;
      padding: 6px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      z-index: 105;
    }

    @media (max-width: 640px) {
      .role-switcher-bar { max-width: 480px; }
    }

    .role-toggle-btn {
      background: var(--primary-pink);
      color: var(--dark-green);
      border: none;
      padding: 4px 12px;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-toggle-btn:hover { background: #ffffff; }

    /* Header Superior Fijo */
    .header {
      position: fixed;
      top: 29px;
      width: 100%;
      max-width: 960px;
      background-color: var(--bg-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #EAE0D0;
      z-index: 100;
    }

    @media (max-width: 640px) {
      .header { max-width: 480px; }
    }

    .brand-pill {
      background-color: var(--card-bg);
      border: 2px solid var(--pastel-green);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      color: var(--dark-green);
      font-size: 15px;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: var(--card-bg);
      border: 2px solid var(--pastel-green);
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--dark-green);
      cursor: pointer;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 2px solid var(--pastel-green);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 16px;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background-color: var(--accent-pink);
      color: white;
      font-size: 10px;
      border-radius: 10px;
      padding: 2px 5px;
      font-weight: bold;
    }

    .user-avatar {
      background: var(--card-bg);
      border: 2px solid var(--pastel-green);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: var(--dark-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    /* Estilos Generales de Pantallas */
    .screen-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .screen-main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 28px;
      color: #2B2B2B;
    }

    .search-input-pink {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #F3E5F5;
      background-color: var(--soft-pink-bg);
      font-size: 13px;
      outline: none;
      margin-bottom: 16px;
    }

    .pink-card-item {
      background: #FFF5F7;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .pink-card-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(232, 139, 167, 0.15);
    }

    .status-badge-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .badge-dark-purple { background: #3E3846; color: #FFFFFF; }
    .badge-pink-soft { background: #FAD6E2; color: #E88BA7; }
    .badge-green-soft { background: #C7F4D2; color: #1E6B30; }

    .menu-option-row {
      background: #FFF5F7;
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-option-row:hover { background: #FFE8EF; }

    .menu-option-row .circle-icon {
      width: 36px;
      height: 36px;
      background: #FFE4EC;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 16px;
    }

    /* Secciones (Vistas SPA) */
    .view {
      display: none;
      padding: 16px;
    }

    .view.active {
      display: block;
    }

    /* Tarjetas Estilo Kawaii Generales */
    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      position: relative;
    }

    .card-banner {
      background: linear-gradient(135deg, #FFF4E0, #FAD6E2);
      border: 2px solid var(--pastel-green);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      color: var(--dark-green);
      margin-bottom: 6px;
    }

    .subtitle-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--dark-green);
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .btn-pill {
      background-color: var(--card-bg);
      border: 2px solid var(--pastel-green);
      border-radius: 20px;
      padding: 6px 14px;
      font-family: 'Fredoka', sans-serif;
      color: var(--dark-green);
      cursor: pointer;
      font-weight: 500;
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
    }

    .btn-primary {
      background-color: var(--pastel-green);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--dark-green);
    }

    .btn-secondary {
      background-color: var(--primary-pink);
      color: var(--dark-green);
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-whatsapp {
      background-color: #25D366;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    /* Sub-pestañas Almacén */
    .wh-tab-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .wh-tab-btn {
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid var(--border-color);
      background: var(--card-bg);
      color: #666;
      transition: all 0.2s;
    }

    .wh-tab-btn.active {
      background: var(--dark-green);
      color: white;
      border-color: var(--dark-green);
    }

    /* Tablas Estilo Excel Kawaii */
    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 8px;
      background: #FFF;
      border-radius: 12px;
      overflow: hidden;
    }
    .excel-table th {
      background: #FFF0F5;
      color: var(--dark-green);
      font-weight: 700;
      padding: 8px 10px;
      text-align: left;
      border-bottom: 2px solid var(--primary-pink);
    }
    .excel-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #F0E6D8;
      color: #444;
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-card .num {
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      color: var(--dark-green);
    }

    .stat-card .label {
      font-size: 10px;
      font-weight: 700;
      color: #666;
    }

    .category-card {
      background-color: #FFF;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      border: 2px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .category-card:hover { transform: translateY(-2px); }

    .category-card.pink { background-color: #FFF0F5; border-color: #F8C3D2; }
    .category-card.purple { background-color: #F5F0FF; border-color: #D7C7F4; }

    /* Formularios */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--dark-green);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: #FAF6EE;
      outline: none;
      font-size: 13px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal-overlay.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--bg-color);
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      border-top: 3px solid var(--pastel-green);
      box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    .list-menu-item {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: var(--dark-green);
    }

    .list-menu-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Navbar Inferior Fijo */
    .navbar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 460px;
      background-color: var(--card-bg);
      border: 2px dashed var
